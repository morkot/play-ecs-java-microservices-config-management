# Server Configuration
server.port=8080

# Application Configuration (Property-based defaults)
app.name=ecs-config-demo
app.environment=dev
app.version=1.0.0
app.feature.flag=false
app.config.source=properties-file

# SSM Parameter Store Configuration
app.config.use-ssm=true
app.config.ssm.path=/ecs-config-demo/

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
