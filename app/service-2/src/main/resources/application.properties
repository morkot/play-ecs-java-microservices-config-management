# Server Configuration
server.port=8081
server.servlet.context-path=/service-2

# Application Configuration (Property-based defaults)
app.name=service-2
app.environment=local
app.version=1.0.0
app.feature.flag=false

# SSM Parameter Store Configuration
# Default: disabled for local development
# Override in profile-specific properties (application-dev.properties, application-prod.properties)
app.config.use-ssm=false
app.config.ssm.path=/ecs-config-demo/local/service-2/

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
